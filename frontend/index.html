<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>pvorg</title>
    <script>
      // Apply the saved appearance before first paint (Dark by default, SPEC §6.5).
      (function () {
        var choice = localStorage.getItem("pvorg.appearance") || "dark";
        if (choice === "system") choice = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = choice === "light" ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
