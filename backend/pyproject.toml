[project]
name = "pvorg-backend"
version = "1.0.0"
description = "pvorg - personal video + gallery organizer backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pillow",
]

[project.scripts]
pvorg = "main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
